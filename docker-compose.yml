name: moonwitness-memory
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATA_DIR: /data
      S3_ENDPOINT_URL: http://rclone-s3:9000
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATA_DIR: /data
      S3_ENDPOINT_URL: http://rclone-s3:9000
    volumes:
      - ./data:/data
      - ./data/models:/root/.cache/fastembed
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  rclone-s3:
    image: rclone/rclone:1.76.0
    profiles: ["drive"]
    environment:
      RCLONE_CONFIG: /config/rclone.conf
    command:
      - serve
      - s3
      - gdrive:MOONWITNESS-MEMORY
      - --addr
      - 0.0.0.0:9000
      - --auth-key
      - ${S3_ACCESS_KEY:-local-memory-access},${S3_SECRET_KEY:-replace-this-long-random-secret}
    volumes:
      - ./data/rclone:/config
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:53682:53682"
    restart: unless-stopped
